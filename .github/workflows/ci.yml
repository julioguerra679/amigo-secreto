name: CI

# Se ejecuta en cada push y en cada pull request contra main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Tests sobre SQLite
        env:
          SECRET_KEY: clave-de-ci
          ADMIN_PASSWORD: ci-admin-password
          MAIL_ENABLED: "false"
        run: pytest -q

  test-postgres:
    name: Tests sobre PostgreSQL
    runs-on: ubuntu-latest

    # La misma suite contra PostgreSQL: es el motor que se usa al desplegar
    # en planes gratuitos, donde el sistema de archivos es efímero y SQLite
    # no sirve. Si algo solo funciona en SQLite, este job lo detecta.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: amigo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/amigo_test
          SECRET_KEY: clave-de-ci
          ADMIN_PASSWORD: ci-admin-password
          MAIL_ENABLED: "false"
        run: pytest -q

  docker:
    name: Build de la imagen Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen
        run: docker build -t amigo-secreto:ci .
