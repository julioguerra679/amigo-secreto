[project]
name = "amigo-secreto"
version = "1.0.0"
description = "Aplicación web para organizar un Amigo Secreto con FastAPI"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 90
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "B008",  # Depends(...) en valores por defecto: es el patrón de FastAPI
    "E501",  # la longitud de línea ya la controla el formateador
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
